# free-model-radar 供应商名录与已知规约
# 遵循【穿透三铁律】：
# 1. 严禁使用 Combo 别名（如 AMD, qoder, cline）充当模型，必须穿透到真实原子模型 ID；
# 2. 国服与国际服严格物理隔离（qoder-cn vs qoder）；
# 3. 规约优先：已声明 context_length 的模型在 L2 阶段仅做 1 发最小抽样。

defaults:
  gateway_url: "http://127.0.0.1:20128"
  sqlite_db: "/home/linxuan/.hermes/data/model-radar.sqlite"
