# free-model-radar v3.0 供应商名录与一手前哨探测规约
# 遵循【独立双轨前哨三铁律】：
# 1. 彻底剥离网关本地旧账（禁止从 10Router 源码/本地注册表回退读取模型）；
# 2. 探针 100% 直连官方一手源（NPM 生产发版、动态推荐 API、官方文档活动站）；
# 3. 国服与国际服严格物理隔离（workbuddy-cn vs workbuddy, qoder-cn vs qoder）。

defaults:
  gateway_url: "http://127.0.0.1:20128"
  sqlite_db: "/home/linxuan/.hermes/data/model-radar.sqlite"
  router_db: "/home/linxuan/.10router-bare-data/db/data.sqlite"
  history_retention_days: 30

vendors:
  workbuddy-cn:
    vendor_id: "workbuddy-cn"
    name: "WorkBuddy 国服 (CN)"
    doc_url: "https://www.codebuddy.cn/docs/cli/models"
    discovery:
      type: "package_introspect"
      package_name: "@tencent-ai/codebuddy-code"
      registry_url: "https://registry.npmmirror.com/@tencent-ai/codebuddy-code/latest"
      fallback_doc_url: "https://www.codebuddy.cn/docs/cli/models"
    gateway_binding:
      alias_prefixes: ["cbcn"]
      provider_names: ["workbuddy-cn", "codebuddy-cn"]
    stream_only: false
    models:
      cbcn/hy4-preview:
        model_id: "cbcn/hy4-preview"
        stream_only: false
        known_specs:
          context_length: 128000
          rpm_limit: 15
          pricing: "free"
      cbcn/glm-5.3-flash:
        model_id: "cbcn/glm-5.3-flash"
        stream_only: false
        known_specs:
          context_length: 128000
